version: "3.9"

services:
  frontend:
    build: ./react_app
    container_name: react_frontend
    networks:
      - app-network
    volumes:
      - react_build:/app/build   # persist React build output

  backend:
    build: ./node_app
    container_name: node_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URL=mongodb://admin:admin123@mongo:27017/elearninghub?authSource=admin
    depends_on:
      - mongo
    networks:
      - app-network

  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME: admin
      - MONGO_INITDB_ROOT_PASSWORD: admin123
      - MONGO_INITDB_DATABASE: elearninghub
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "81:81"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - react_build:/usr/share/nginx/html
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  react_build:
